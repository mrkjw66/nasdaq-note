<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나스닥 노트</title>
<meta name="description" content="미국 주식 56종목을 매일 종가로 정리한 노트. 오늘 시장 한 줄 요약과 다가오는 일정.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 색은 노트(note3)와 같은 값. 밝은/어두운 테마는 기기 설정을 따라가요. */
:root {
  color-scheme: light;
  --bg: #EFE6D7; --surface: #FBF7F0; --fg: #2B2118; --muted: #584834; --line: #DCCDB6;
  --accent: #8A5528; --accent-bg: #F2E3CC; --up: #C5352B; --down: #2D5BAE; --btn-bg: #6B4220; --btn-fg: #FFF8EC;
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #1B1510; --surface: #251E17; --fg: #EEE4D4; --muted: #C9B89E; --line: #3B3026;
    --accent: #D9A064; --accent-bg: #3A2A1A; --up: #FF6B5E; --down: #6F95FF; --btn-bg: #D9A064; --btn-fg: #1B1510; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
/* 한 화면 구성: 위(제목·버튼) / 가운데(한 줄 요약) / 아래(일정)를 화면 높이(100dvh)에 맞춰 세로로 배치해요. */
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); word-break: keep-all;
  min-height: 100dvh;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.wrap { max-width: 720px; height: calc(100dvh - max(14px, env(safe-area-inset-top)) - max(12px, env(safe-area-inset-bottom)));
  min-height: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
a { color: inherit; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
.asof { font-family: var(--num); font-size: 12px; color: var(--muted); white-space: nowrap; }

.go { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.go a { text-decoration: none; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); }
.go a.main { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.go b { display: block; font-size: 15px; }
.go span { display: block; font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 한 줄 요약 표: 왼쪽 이름표 + 오른쪽 한 줄 내용(넘치면 … 처리) */
.rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; min-height: 0; }
.row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row dt { font-size: 12px; color: var(--muted); }
.row dd { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row dd.two, .row dd.three { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row dd.three { -webkit-line-clamp: 3; }
.row dd.small { font-size: 13px; }
@media (max-width: 400px) { .row { grid-template-columns: 34px 1fr; gap: 6px; } .sep { margin: 0 3px; } .row dd.small { font-size: 12px; } }
.sep { color: var(--muted); opacity: .6; margin: 0 4px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.stale { opacity: .5; }   /* 아직 그날 종가를 못 받은 앞 거래일 값 */
@media (max-width: 699px) { .w { display: none; } }   /* 휴대폰에서는 한 줄에 들어가게 일부 항목을 숨겨요 */

/* 맨 아래 일정 한 줄 */
.sched { border-radius: 12px; padding: 10px 12px; background: var(--accent-bg); }
.sched .row { border: 0; padding: 0; }
.sched dt { color: var(--accent); font-weight: 600; }
footer { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (min-width: 700px) {
  body { font-size: 15px; }
  h1 { font-size: 30px; }
  .row { grid-template-columns: 56px 1fr; padding: 9px 0; }
  .go a { padding: 14px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>나스닥 노트</h1>
    <span class="asof" id="asof">종가 기준</span>
  </header>

  <nav class="go" aria-label="페이지 바로가기">
    <a class="main" href="note3/"><b>노트 열기 →</b><span>종목 카드 · 목표주가 · 뉴스</span></a>
    <a href="live/"><b>실시간 시세 →</b><span>TradingView 가격 · 차트</span></a>
  </nav>

  <!-- 중요 정보 한 줄 요약 -->
  <dl class="rows" id="rows"><div class="row"><dt>오늘</dt><dd class="flat">불러오는 중이에요.</dd></div></dl>

  <!-- 맨 아래: 가장 가까운 날의 실적·경제 일정 한 줄 -->
  <dl class="sched"><div class="row"><dt>일정</dt><dd id="sched" class="two flat">―</dd></div></dl>

  <footer>미국 정규장 종가 기준 · 흐린 값은 앞 거래일 값 · 투자 권유 아님 · <a href="old/">예전 페이지</a></footer>
</div>

<script>
/* ---------- 이 페이지가 하는 일 ----------
   data 폴더의 JSON 4개(시세, 뉴스 브리핑, 실적 일정, 경제 일정)를 읽어서
   중요한 것만 한 줄씩 보여 줘요. 자료는 '공개 사이트 갱신' 작업이 매일 08:47, 15:47에 바꿔요. */

// 한 줄에 들어가도록 짧게 줄인 한글 이름. 종류: s = 주식, e = ETF, c = 코인
var NAMES = {
  NVDA:['엔비디아','s'], AAPL:['애플','s'], MSFT:['MS','s'], GOOGL:['알파벳','s'], AMZN:['아마존','s'], AVGO:['브로드컴','s'],
  META:['메타','s'], TSLA:['테슬라','s'], PLTR:['팔란티어','s'], SNPS:['시놉시스','s'], KO:['코카콜라','s'], BAC:['BofA','s'],
  AMD:['AMD','s'], NFLX:['넷플릭스','s'], COST:['코스트코','s'], LLY:['릴리','s'], SPCX:['스페이스X','s'], WMT:['월마트','s'],
  MU:['마이크론','s'], ASML:['ASML','s'], CSCO:['시스코','s'], INTC:['인텔','s'], AMAT:['어플라이드','s'], PANW:['팔로알토','s'],
  TXN:['TI','s'], AMGN:['암젠','s'], LIN:['린데','s'], LRCX:['램리서치','s'], CRWD:['크라우드스트','s'], GILD:['길리어드','s'],
  PEP:['펩시코','s'], ADI:['ADI','s'], SHOP:['쇼피파이','s'], TMUS:['T모바일','s'], ORCL:['오라클','s'], CRM:['세일즈포스','s'],
  ADBE:['어도비','s'], NOW:['서비스나우','s'], INTU:['인튜이트','s'], UBER:['우버','s'], ABNB:['에어비앤비','s'], JPM:['JP모건','s'],
  V:['비자','s'], UNH:['유나이티드','s'], XOM:['엑슨모빌','s'], HD:['홈디포','s'], ISRG:['인튜이티브','s'], NKE:['나이키','s'],
  QQQ:['QQQ','e'], VOO:['VOO','e'], SCHD:['SCHD','e'], SMH:['SMH','e'], TLT:['TLT','e'], GLD:['GLD','e'],
  BTC:['비트코인','c'], ETH:['이더리움','c']
};
var WD = ['일','월','화','수','목','금','토'];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function md(iso) { var p = String(iso).slice(0, 10).split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function mdw(iso) { var d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return md(iso) + '(' + WD[d.getDay()] + ')'; }
// 등락률: 오르면 빨강 ▲, 내리면 파랑 ▼ (색만으로 구분하지 않게 화살표도)
function pct(v, d) {
  if (typeof v !== 'number') return '<span class="flat">―</span>';
  var cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat', a = v > 0 ? '▲' : v < 0 ? '▼' : '';
  return '<span class="num ' + cls + '">' + a + Math.abs(v).toFixed(d == null ? 1 : d) + '%</span>';
}
function price(v) { return typeof v === 'number' ? v.toLocaleString('en-US', { maximumFractionDigits: v >= 1000 ? 0 : 2 }) : '―'; }
var SEP = '<span class="sep">·</span>';
// 여러 항목을 '·'로 잇기. wideFrom 번째부터는 넓은 화면에서만 보여요.
function join(list, wideFrom) {
  return list.map(function (x, i) { return '<span' + (wideFrom != null && i >= wideFrom ? ' class="w"' : '') + '>' + (i ? SEP : '') + x + '</span>'; }).join('');
}
// cls: 'two'(두 줄까지), 'three'(세 줄까지), 'two small'(두 줄 + 작은 글씨). 없으면 한 줄.
function row(label, html, cls) { return '<div class="row"><dt>' + label + '</dt><dd' + (cls ? ' class="' + cls + '"' : '') + '>' + html + '</dd></div>'; }
function load(name) {
  return fetch('data/' + name + '.json?t=' + Math.floor(Date.now() / 300000)).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
}
// 한국 시간(UTC+9)으로 날짜·시각 글자 만들기 (기기 시간대와 상관없이)
function kst(d) {
  var k = new Date(d.getTime() + 9 * 36e5);
  return { key: k.toISOString().slice(0, 10), day: (k.getUTCMonth() + 1) + '/' + k.getUTCDate() + '(' + WD[k.getUTCDay()] + ')',
           time: ('0' + k.getUTCHours()).slice(-2) + ':' + ('0' + k.getUTCMinutes()).slice(-2) };
}

Promise.all([load('market__latest'), load('news__latest'), load('market__earnings'), load('market__macro')]).then(function (r) {
  var L = r[0], N = r[1], E = r[2], M = r[3];
  if (!L || !L.items) { $('rows').innerHTML = row('오늘', '<span class="flat">시세 자료를 불러오지 못했어요.</span>'); return; }
  var asOf = L.asOf, items = L.items;
  function isOld(q) { return q && q.date && asOf && q.date < asOf; }
  $('asof').textContent = mdw(asOf) + ' 종가 기준';

  var h = '';
  // 1) 오늘 한 줄: 아침 브리핑의 첫 문장(길면 두 줄까지)
  var brief = (N && N.brief) || '';
  var m1 = brief.match(/^.*?[요다]\.(?=\s|$)/);   // '…했어요.'까지 = 첫 문장
  var first = m1 ? m1[0] : brief;
  if (first) h += row('오늘', esc(first), 'three');

  // 2) 지수: 등락만 한 줄로, 3) 환율
  var short = { 'S&P 500': 'S&P', '나스닥 종합': '나스닥', '나스닥 100': '나100', '다우': '다우' };
  var idx = (L.idx || []).filter(function (x) { return x.n !== '나스닥 100'; }).concat((L.idx || []).filter(function (x) { return x.n === '나스닥 100'; }));  // 나스닥 100은 맨 뒤(휴대폰에서 숨김)
  h += row('지수', join(idx.map(function (x) { return (short[x.n] || esc(x.n)) + ' ' + pct(x.chg1d, 2); }), 3));
  if (L.fx && typeof L.fx.usdkrw === 'number') h += row('환율', '<span class="num">' + L.fx.usdkrw.toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '원</span> <span class="flat">(' + md(L.fx.date || asOf) + ')</span>');

  // 4) 많이 오른·내린 주식 3개씩 (기준일 종가를 받은 종목만)
  var st = Object.keys(items).filter(function (t) { var q = items[t]; return (NAMES[t] || [])[1] === 's' && q && q.date === asOf && typeof q.chg1d === 'number'; });
  st.sort(function (a, b) { return items[b].chg1d - items[a].chg1d; });
  function nm(t) { return esc(NAMES[t][0]) + ' ' + pct(items[t].chg1d); }
  var up = st.filter(function (t) { return items[t].chg1d > 0; }).slice(0, 3);
  var dn = st.filter(function (t) { return items[t].chg1d < 0; }).slice(-3).reverse();
  h += row('상승', up.length ? join(up.map(nm), 2) : '<span class="flat">없어요</span>');
  h += row('하락', dn.length ? join(dn.map(nm), 2) : '<span class="flat">없어요</span>');

  // 5) ETF, 코인 한 줄씩
  function line(kind, withPrice) {
    return join(Object.keys(NAMES).filter(function (t) { return NAMES[t][1] === kind && items[t]; }).map(function (t) {
      var q = items[t];
      return '<span' + (isOld(q) ? ' class="stale" title="' + md(q.date) + ' 값(아직 그날 종가를 못 받았어요)"' : '') + '>' + esc(NAMES[t][0]) + ' ' +
        (withPrice ? '<span class="num w">' + price(q.close) + ' </span>' : '') + pct(q.chg1d) + '</span>';
    }));
  }
  h += row('ETF', line('e', false), 'two small');   // ETF는 6개라 두 줄까지
  h += row('코인', line('c', true));
  $('rows').innerHTML = h;

  // 6) 맨 아래 일정: 가장 가까운 하루(한국 날짜)의 실적·경제 발표를 한 줄로
  var now = Date.now(), ev = [];
  if (E && E.items) Object.keys(E.items).forEach(function (t) {
    var e = E.items[t]; if (!e || !e.date) return;
    // 장 시작 전(BMO) = 한국 그날 밤 22:30, 장 마감 후(AMC) = 한국 다음 날 06:00 (대략)
    var k = e.time === 'AMC' ? new Date(new Date(e.date + 'T06:00:00+09:00').getTime() + 864e5) : new Date(e.date + 'T22:30:00+09:00');
    ev.push({ k: k, kind: 'e', name: (NAMES[t] || [t])[0] });
  });
  if (M && M.items) M.items.forEach(function (m) {
    if (m.kstISO && (m.importance || 0) >= 2) ev.push({ k: new Date(m.kstISO), kind: 'm', name: m.name.replace(/\s*\(.*\)$/, ''), hi: m.importance >= 3 });
  });
  ev = ev.filter(function (x) { return x.k.getTime() > now - 2 * 36e5; }).sort(function (a, b) { return a.k - b.k; });
  if (!ev.length) { $('sched').textContent = '앞으로 잡힌 큰 일정이 없어요.'; return; }
  var day = kst(ev[0].k).key, today = ev.filter(function (x) { return kst(x.k).key === day; });
  // 같은 시각의 실적은 이름을 묶어요: "06:00 어플라이드·시스코 실적"
  var byTime = {};
  today.forEach(function (x) { var t = kst(x.k).time + '|' + x.kind; (byTime[t] = byTime[t] || []).push(x); });
  var parts = Object.keys(byTime).sort().map(function (key) {
    var g = byTime[key], time = key.split('|')[0];
    return '<span class="num">' + time + '</span> ' + (g[0].kind === 'e'
      ? esc(g.map(function (x) { return x.name; }).join('·')) + ' 실적'
      : g.map(function (x) { return (x.hi ? '<b>' : '') + esc(x.name) + (x.hi ? '</b>' : ''); }).join('·'));
  });
  $('sched').innerHTML = '<b>' + kst(ev[0].k).day + '</b> ' + parts.join(SEP);
  $('sched').classList.remove('flat');
});
</script>
</body>
</html>
