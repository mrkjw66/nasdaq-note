<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나스닥 노트</title>
<meta name="description" content="미국 주식 56종목을 매일 종가로 정리한 노트. 주요 종목 등락, 시장 상황, 일정, 뉴스를 한 화면에.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 색은 노트(note3)와 같은 값. 밝은/어두운 테마는 기기 설정을 따라가요. */
:root {
  color-scheme: light;
  --bg: #EFE6D7; --surface: #FBF7F0; --fg: #2B2118; --muted: #584834; --line: #DCCDB6;
  --accent: #8A5528; --accent-bg: #F2E3CC; --up: #C5352B; --down: #2D5BAE; --btn-bg: #6B4220; --btn-fg: #FFF8EC;
  --up-bg: rgba(197, 53, 43, .12); --down-bg: rgba(45, 91, 174, .12);
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #1B1510; --surface: #251E17; --fg: #EEE4D4; --muted: #C9B89E; --line: #3B3026;
    --accent: #D9A064; --accent-bg: #3A2A1A; --up: #FF6B5E; --down: #6F95FF; --btn-bg: #D9A064; --btn-fg: #1B1510;
    --up-bg: rgba(255, 107, 94, .16); --down-bg: rgba(111, 149, 255, .16); }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); word-break: keep-all;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
/* 한 화면: 화면 높이에 맞춰 위(머리) · 가운데(칸 3개) · 아래(뉴스) 순서로 쌓아요. */
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  height: calc(100dvh - max(12px, env(safe-area-inset-top)) - max(10px, env(safe-area-inset-bottom))); min-height: 540px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
a { color: inherit; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.stale { opacity: .5; }

/* 1) 로고 및 제목 */
header { display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; flex: none; }
.ttl { min-width: 0; flex: 1; }
h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
.asof { font-family: var(--num); font-size: 11.5px; color: var(--muted); }
.links { display: flex; gap: 6px; }
.links a { text-decoration: none; font-size: 12.5px; font-weight: 600; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.links a.main { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }

/* 칸 공통 */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 15px; cursor: pointer; transition: border-color .15s, transform .15s; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.tile h2 { font-size: 13.5px; font-weight: 700; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.tile h2 svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
.tile h2 small { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 11px; }

/* 2) 가운데: 왼쪽 큰 칸 + 오른쪽 위·아래 칸 */
.mid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 14px; flex: none; }   /* 가운데는 내용 높이만큼, 남는 높이는 뉴스 칸이 써요 */
.mid .big { grid-row: 1 / 3; }

/* 주요 종목 등락: 이름·등락률 + 막대 */
.mv { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; min-height: 0; }
.mv li { min-width: 0; }
.mv .l { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.mv .l span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv .bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 3px; overflow: hidden; }
.mv .bar i { display: block; height: 100%; border-radius: 3px; }
.mv .gap { height: 4px; }

/* 시장 상황: 이름 · 눈금 막대 · 등락 */
.mk { margin: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; align-content: space-evenly; flex: 1; font-size: 13px; }
.mk dt { color: var(--muted); white-space: nowrap; }
.mk dd { margin: 0; }
.meter { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.meter::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }
.meter i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }

/* 일정: 달력 모양 날짜 + 두 줄 */
.cal { display: flex; gap: 10px; align-items: center; flex: 1; }
.cal .pg { flex: none; width: 40px; border-radius: 8px; overflow: hidden; text-align: center; border: 1px solid var(--line); background: var(--bg); }
.cal .pg b { display: block; background: var(--accent); color: var(--btn-fg); font-size: 10.5px; padding: 1px 0; }
.cal .pg span { display: block; font-family: var(--num); font-size: 17px; font-weight: 500; line-height: 1.35; }
.cal ul { list-style: none; margin: 0; padding: 0; min-width: 0; font-size: 12.5px; }
.cal li { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; margin-bottom: 2px; }   /* 좁은 칸이라 일정마다 두 줄까지 */
.cal li .num { color: var(--muted); margin-right: 4px; }
.next { margin-top: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 3) 뉴스 요약: 남은 높이를 모두 써요 */
.news { flex: 1; }
/* 칸을 누를 수 있다는 표시: 제목 옆 › 와 눌렀을 때 테두리 색 */
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.99); }
.tile h2 a { text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tile h2 a::after { content: '›'; color: var(--muted); font-size: 16px; line-height: 1; }
.tile h2 a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.brief { font-size: 13px; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; flex: 1; min-height: 0; }   /* 뉴스 칸 남은 높이만큼만 */
.nl li { display: grid; grid-template-columns: 4px auto 1fr auto; gap: 8px; align-items: center; font-size: 13px; min-width: 0; }
.nl .k { align-self: stretch; border-radius: 2px; }
.nl .k.up { background: var(--up); } .nl .k.down { background: var(--down); } .nl .k.neutral { background: var(--line); }
.chip { font-family: var(--num); font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--accent-bg); color: var(--accent); }
.nl .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.nl .tt:hover { text-decoration: underline; }
.nl .d { font-family: var(--num); font-size: 11px; color: var(--muted); }
footer { font-size: 10.5px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 400px) {
  .links a { padding: 6px 8px; font-size: 12px; }
  h1 { font-size: 19px; }
  .tile { padding: 11px 12px; }
  .wrap, .mid { gap: 11px; }
}
@media (min-width: 700px) {
  body { font-size: 15px; }
  .logo { width: 46px; height: 46px; }
  h1 { font-size: 27px; }
  .tile { padding: 18px 20px; }
  .tile h2 { font-size: 14.5px; }
  .wrap, .mid { gap: 18px; }
  .mv .l, .mk, .nl li { font-size: 14px; }
  .cal ul { font-size: 13.5px; }
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 1) 로고 및 제목 -->
  <header>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="1" y="1" width="46" height="46" rx="12" fill="var(--btn-bg)"/>
      <path d="M11 33 L20 24 L26 29 L37 16" fill="none" stroke="var(--btn-fg)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="37" cy="16" r="3.4" fill="var(--btn-fg)"/>
      <path d="M11 38 H37" stroke="var(--btn-fg)" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    </svg>
    <div class="ttl">
      <h1>나스닥 노트</h1>
      <div class="asof" id="asof">종가 기준</div>
    </div>
    <nav class="links" aria-label="페이지 바로가기">
      <a class="main" href="../../note3/">노트</a>
      <a href="../../live/">실시간</a>
    </nav>
  </header>

  <!-- 2) 가운데 칸 3개 -->
  <div class="mid">
    <section class="tile big" data-go="../../note3/#stocks" aria-labelledby="h-mv">
      <h2 id="h-mv"><a href="../../note3/#stocks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12 L6 7 L9 10 L14 4"/><path d="M10 4 H14 V8"/></svg>종목 등락</a></h2>
      <ul class="mv" id="mv"><li class="flat">불러오는 중이에요.</li></ul>
    </section>
    <section class="tile" data-go="../../note3/#market" aria-labelledby="h-mk">
      <h2 id="h-mk"><a href="../../note3/#market"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="8" width="3" height="6"/><rect x="6.5" y="4" width="3" height="10"/><rect x="11" y="6" width="3" height="8"/></svg>시장 상황</a></h2>
      <dl class="mk" id="mk"></dl>
    </section>
    <section class="tile" data-go="../../note3/#cal" aria-labelledby="h-cal">
      <h2 id="h-cal"><a href="../../note3/#cal"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7 H14 M5 1.5 V4 M11 1.5 V4"/></svg>일정</a></h2>
      <div class="cal" id="cal"><span class="flat">―</span></div>
      <div class="next" id="next"></div>
    </section>
  </div>

  <!-- 3) 뉴스 요약 -->
  <section class="tile news" data-go="../../note3/#news" aria-labelledby="h-nw">
    <h2 id="h-nw"><a href="../../note3/#news"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M5 6 H11 M5 9 H11 M5 12 H8.5"/></svg>뉴스 요약</a><small id="nwWhen"></small></h2>
    <p class="brief" id="brief"></p>
    <ul class="nl" id="nl"></ul>
  </section>

  <footer>미국 정규장 종가 기준 · 흐린 값은 앞 거래일 값 · 투자 권유 아님 · <a href="../">예전 페이지</a></footer>
</div>

<script>
/* ---------- 이 페이지가 하는 일 ----------
   data 폴더의 JSON 4개(시세, 뉴스, 실적 일정, 경제 일정)를 읽어서 네 칸을 채워요.
   자료는 '공개 사이트 갱신' 작업이 매일 08:47, 15:47에 바꿔요. */

// 짧은 한글 이름. 종류: s = 주식, e = ETF, c = 코인
var NAMES = {
  NVDA:['엔비디아','s'], AAPL:['애플','s'], MSFT:['MS','s'], GOOGL:['알파벳','s'], AMZN:['아마존','s'], AVGO:['브로드컴','s'],
  META:['메타','s'], TSLA:['테슬라','s'], PLTR:['팔란티어','s'], SNPS:['시놉시스','s'], KO:['코카콜라','s'], BAC:['BofA','s'],
  AMD:['AMD','s'], NFLX:['넷플릭스','s'], COST:['코스트코','s'], LLY:['릴리','s'], SPCX:['스페이스X','s'], WMT:['월마트','s'],
  MU:['마이크론','s'], ASML:['ASML','s'], CSCO:['시스코','s'], INTC:['인텔','s'], AMAT:['어플라이드','s'], PANW:['팔로알토','s'],
  TXN:['TI','s'], AMGN:['암젠','s'], LIN:['린데','s'], LRCX:['램리서치','s'], CRWD:['크라우드스트','s'], GILD:['길리어드','s'],
  PEP:['펩시코','s'], ADI:['ADI','s'], SHOP:['쇼피파이','s'], TMUS:['T모바일','s'], ORCL:['오라클','s'], CRM:['세일즈포스','s'],
  ADBE:['어도비','s'], NOW:['서비스나우','s'], INTU:['인튜이트','s'], UBER:['우버','s'], ABNB:['에어비앤비','s'], JPM:['JP모건','s'],
  V:['비자','s'], UNH:['유나이티드','s'], XOM:['엑슨모빌','s'], HD:['홈디포','s'], ISRG:['인튜이티브','s'], NKE:['나이키','s'],
  QQQ:['QQQ','e'], VOO:['VOO','e'], SCHD:['SCHD','e'], SMH:['SMH','e'], TLT:['TLT','e'], GLD:['GLD','e'],
  BTC:['비트코인','c'], ETH:['이더리움','c']
};
var WD = ['일','월','화','수','목','금','토'];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function md(iso) { var p = String(iso).slice(0, 10).split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function mdw(iso) { var d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return md(iso) + '(' + WD[d.getDay()] + ')'; }
function pct(v, d) {
  if (typeof v !== 'number') return '<span class="flat">―</span>';
  var cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat', a = v > 0 ? '▲' : v < 0 ? '▼' : '';
  return '<span class="num ' + cls + '">' + a + Math.abs(v).toFixed(d == null ? 1 : d) + '%</span>';
}
function load(name) {
  return fetch('../../data/' + name + '.json?t=' + Math.floor(Date.now() / 300000)).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
}
// 한국 시간(UTC+9) 날짜·시각 (기기 시간대와 상관없이)
function kst(d) {
  var k = new Date(d.getTime() + 9 * 36e5);
  return { key: k.toISOString().slice(0, 10), m: k.getUTCMonth() + 1, d: k.getUTCDate(), w: WD[k.getUTCDay()],
           time: ('0' + k.getUTCHours()).slice(-2) + ':' + ('0' + k.getUTCMinutes()).slice(-2) };
}

Promise.all([load('market__latest'), load('news__latest'), load('market__earnings'), load('market__macro')]).then(function (r) {
  var L = r[0], N = r[1], E = r[2], M = r[3];
  if (!L || !L.items) { $('mv').innerHTML = '<li class="flat">시세 자료를 불러오지 못했어요.</li>'; return; }
  var asOf = L.asOf, items = L.items;
  $('asof').textContent = mdw(asOf) + ' 미국 종가 기준';

  /* 주요 종목 등락: 그날 종가를 받은 주식 중 많이 오른 3개, 많이 내린 3개.
     막대 길이 = 등락률 크기(이 6개 중 가장 큰 값을 꽉 찬 막대로). */
  var st = Object.keys(items).filter(function (t) { var q = items[t]; return (NAMES[t] || [])[1] === 's' && q && q.date === asOf && typeof q.chg1d === 'number'; });
  st.sort(function (a, b) { return items[b].chg1d - items[a].chg1d; });
  var up = st.filter(function (t) { return items[t].chg1d > 0; }).slice(0, 3);
  var dn = st.filter(function (t) { return items[t].chg1d < 0; }).slice(-3).reverse();
  var maxAbs = Math.max.apply(null, up.concat(dn).map(function (t) { return Math.abs(items[t].chg1d); }).concat([1]));
  function mvLi(t) {
    var v = items[t].chg1d, w = Math.max(6, Math.round(Math.abs(v) / maxAbs * 100));
    return '<li><div class="l"><span>' + esc(NAMES[t][0]) + '</span>' + pct(v) + '</div><div class="bar"><i style="width:' + w + '%;background:var(' + (v > 0 ? '--up' : '--down') + ')"></i></div></li>';
  }
  $('mv').innerHTML = (up.map(mvLi).join('') || '<li class="flat">오른 종목 없음</li>') + '<li class="gap"></li>' + (dn.map(mvLi).join('') || '<li class="flat">내린 종목 없음</li>');
  var sm = $('h-mv').querySelector('small') || $('h-mv').appendChild(document.createElement('small')); sm.textContent = st.length + '/48';

  /* 시장 상황: 지수 3개 + 비트코인 + 환율. 눈금 막대는 가운데가 0%, 양끝이 ±1.5%. */
  function meter(v) {
    if (typeof v !== 'number') return '<div class="meter"></div>';
    var w = Math.min(50, Math.abs(v) / 1.5 * 50);   // 막대 끝 = ±1.5%
    return '<div class="meter"><i style="' + (v >= 0 ? 'left:50%' : 'right:50%') + ';width:' + w + '%;background:var(' + (v >= 0 ? '--up' : '--down') + ')"></i></div>';
  }
  var want = [['S&P 500', 'S&P'], ['나스닥 종합', '나스닥'], ['다우', '다우']], mk = '';
  want.forEach(function (p) {
    var x = (L.idx || []).filter(function (i) { return i.n === p[0]; })[0];
    if (x) mk += '<dt>' + p[1] + '</dt><dd>' + meter(x.chg1d) + '</dd><dd>' + pct(x.chg1d, 2) + '</dd>';
  });
  var b = items.BTC;
  if (b) mk += '<dt' + (b.date < asOf ? ' class="stale"' : '') + '>비트코인</dt><dd' + (b.date < asOf ? ' class="stale"' : '') + '>' + meter(b.chg1d) + '</dd><dd' + (b.date < asOf ? ' class="stale"' : '') + '>' + pct(b.chg1d, 2) + '</dd>';
  if (L.fx && typeof L.fx.usdkrw === 'number') mk += '<dt>환율</dt><dd colspan="2" style="grid-column:2 / 4;text-align:right" class="num">' + L.fx.usdkrw.toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '원</dd>';
  $('mk').innerHTML = mk;

  /* 일정: 가장 가까운 하루를 달력 모양으로, 그다음 일정은 아래 작은 글씨 한 줄 */
  var now = Date.now(), ev = [];
  if (E && E.items) Object.keys(E.items).forEach(function (t) {
    var e = E.items[t]; if (!e || !e.date) return;
    // 장 시작 전(BMO) = 한국 그날 밤 22:30, 장 마감 후(AMC) = 한국 다음 날 06:00 (대략)
    var k = e.time === 'AMC' ? new Date(new Date(e.date + 'T06:00:00+09:00').getTime() + 864e5) : new Date(e.date + 'T22:30:00+09:00');
    ev.push({ k: k, kind: 'e', name: (NAMES[t] || [t])[0] });
  });
  if (M && M.items) M.items.forEach(function (m) {
    if (m.kstISO && (m.importance || 0) >= 2) ev.push({ k: new Date(m.kstISO), kind: 'm', name: m.name.replace(/\s*\(.*\)$/, ''), hi: m.importance >= 3 });
  });
  ev = ev.filter(function (x) { return x.k.getTime() > now - 2 * 36e5; }).sort(function (a, b) { return a.k - b.k; });
  function dayLines(list) {   // 같은 시각의 실적은 이름을 묶어요
    var by = {};
    list.forEach(function (x) { var key = kst(x.k).time + '|' + x.kind; (by[key] = by[key] || []).push(x); });
    return Object.keys(by).sort().map(function (key) {
      var g = by[key], time = key.split('|')[0];
      return { time: time, text: g[0].kind === 'e' ? g.map(function (x) { return x.name; }).join('·') + ' 실적' : g.map(function (x) { return x.name; }).join('·') };
    });
  }
  if (ev.length) {
    var k0 = kst(ev[0].k), day0 = ev.filter(function (x) { return kst(x.k).key === k0.key; });
    $('cal').innerHTML = '<div class="pg"><b>' + k0.m + '월</b><span>' + k0.d + '</span></div><ul>' +
      dayLines(day0).map(function (l) { return '<li><span class="num">' + l.time + '</span>' + esc(l.text) + '</li>'; }).join('') +
      '<li class="flat" style="font-size:11.5px">' + k0.w + '요일 · 한국 시간</li></ul>';
    var rest = ev.filter(function (x) { return kst(x.k).key !== k0.key; });
    if (rest.length) {
      var k1 = kst(rest[0].k), day1 = rest.filter(function (x) { return kst(x.k).key === k1.key; });
      $('next').textContent = '다음 ' + k1.m + '/' + k1.d + '(' + k1.w + ') ' + dayLines(day1).map(function (l) { return l.text; }).join(', ');
    }
  } else { $('cal').innerHTML = '<span class="flat">앞으로 잡힌 큰 일정이 없어요.</span>'; }

  /* 뉴스 요약: 아침 브리핑 + 최근 뉴스(날짜 최신 → 중요도 높은 순) */
  if (N) {
    $('brief').textContent = N.brief || '';
    if (N.updatedAt) $('nwWhen').textContent = N.updatedAt.slice(5, 10).replace('-', '/') + ' ' + N.updatedAt.slice(11, 16);
    var list = (N.items || []).slice().sort(function (a, b) { return a.date === b.date ? (b.importance || 0) - (a.importance || 0) : (a.date < b.date ? 1 : -1); }).slice(0, 12);   // 최대 12개, 칸에 안 들어가는 줄은 fitNews가 숨겨요
    $('nl').innerHTML = list.map(function (x) {
      var imp = x.impact === 'up' || x.impact === 'down' ? x.impact : 'neutral';
      return '<li><span class="k ' + imp + '"></span><span class="chip">' + esc(x.t) + '</span>' +
        (x.url ? '<a class="tt" href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a>' : '<span class="tt">' + esc(x.title) + '</span>') +
        '<span class="d">' + md(x.date) + '</span></li>';
    }).join('');
    fitNews();
  }
});
// 뉴스 칸 높이에 다 들어가지 않는 줄은 숨겨요(반쯤 잘린 줄이 보이지 않게). 화면 크기가 바뀌면 다시 계산해요.
function fitNews() {
  var nl = $('nl'); if (!nl) return;
  var li = nl.children, i;
  nl.style.justifyContent = 'flex-start';   // 재는 동안은 위로 붙여서
  for (i = 0; i < li.length; i++) li[i].style.display = '';
  var bottom = nl.getBoundingClientRect().bottom;
  for (i = 0; i < li.length; i++) if (li[i].getBoundingClientRect().bottom > bottom + 1) li[i].style.display = 'none';
  nl.style.justifyContent = 'space-evenly';  // 남은 줄을 칸 높이에 고르게
}
// 칸 아무 곳이나 누르면 노트의 해당 탭으로 가요. 단, 뉴스 제목 같은 안쪽 링크를 누르면 그 링크로 가요.
document.addEventListener('click', function (e) {
  if (e.target.closest('a')) return;
  var t = e.target.closest('[data-go]'); if (t) location.href = t.getAttribute('data-go');
});
window.addEventListener('resize', fitNews);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNews);   // 글꼴이 늦게 와서 줄 높이가 바뀌면 다시 계산
</script>
</body>
</html>
